<!DOCTYPE html>
    <html>
    <head>
        <title>Estonia - NBA International Players</title>
        
<style>
    body { font-family: Arial, sans-serif; margin: 40px; color: #333; line-height: 1.6; }
    h1 { color: #1f77b4; border-bottom: 2px solid #1f77b4; padding-bottom: 10px; }
    h2 { color: #444; margin-top: 30px; background: #f4f4f4; padding: 8px; border-left: 5px solid #1f77b4; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; font-size: 14px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    th { background-color: #1f77b4; color: white; }
    tr:hover { background-color: #f5f5f5; }
    .unique-box { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 30px; }
    .player-card { background: #e3f2fd; padding: 10px; border-radius: 4px; font-weight: bold; text-align: center; border: 1px solid #bbdefb; }
</style>

    </head>
    <body>
        <h1>Estonia NBA Alumni Dashboard</h1>

        <h2>1) All-Time Unique Players (2 Total)</h2>
        <div class='unique-box'>
            <div class='player-card'>Henri Drell</div><div class='player-card'>Martin Muursepp</div>
        </div>

        <h2>2) Historical Season-by-Season Log (3 Total Appearances)</h2>
        <table border="1" class="dataframe table">
  <thead>
    <tr style="text-align: right;">
      <th>Season</th>
      <th>Player</th>
      <th>Team</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>2023-24</td>
      <td>Henri Drell</td>
      <td>CHI</td>
    </tr>
    <tr>
      <td>1997-98</td>
      <td>Martin Muursepp</td>
      <td>DAL</td>
    </tr>
    <tr>
      <td>1996-97</td>
      <td>Martin Muursepp</td>
      <td>DAL</td>
    </tr>
  </tbody>
</table>
    </body>
    </html>
